modLoader = "javafml"
loaderVersion = "[1,)"
#issueTrackerURL = ""
license = "${license}"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "${authors}"
description = '''
${description}
'''
logoFile = "${icon}"

[[dependencies."${id}"]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge},)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${id}"]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft},)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${id}"]]
modId = "architectury"
type = "required"
versionRange = "${architectury_version}"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${id}"]]
modId = "geckolib"
type = "required"
versionRange = "${geckolib_version}"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "${id}.mixins.json"
